# yaml-language-server: $schema=https://tryhangar.io/schema/hangar.v1.json
version: 1
name: worthly
description: Organizador de finanças pessoais open source com Open Finance (Meu Pluggy), patrimônio, faturas, gastos, investimentos, plano da casa e o Tito, um assistente com IA (Claude, DeepSeek ou compatível com OpenAI).

services:
  web:
    # Next.js 16 com o builder automático (railpack). O `npm start` aplica as
    # migrations do Prisma antes de subir o servidor: com SQLite no volume, as
    # migrations precisam rodar no `start`, não no `preDeploy`.
    buildCommand: npm run build
    start: npm start
    port: 3000
    # O SQLite mora aqui e sobrevive aos deploys. Mantenha 1 réplica.
    volume:
      path: /data
    env:
      NODE_ENV: production
      DATABASE_URL: file:/data/worthly.db
      # Domínio das chaves de acesso (Face ID/biometria). Não troque depois.
      APP_URL: ${{ web.url }}
      # O Tito (assistente) é opcional e se configura na própria tela dele,
      # sem chave no deploy. Se preferir pelo servidor, defina como segredo:
      # ASSISTANT_PROVIDER (anthropic | deepseek | openai-compatible) e
      # ANTHROPIC_API_KEY, DEEPSEEK_API_KEY ou ASSISTANT_API_KEY,
      # ASSISTANT_BASE_URL e ASSISTANT_MODEL.
